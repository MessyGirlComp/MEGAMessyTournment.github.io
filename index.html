<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEGA Messy Tournament - Season 1</title>

    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="M.M.Cup" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    rgba(125, 211, 252, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #1a1a2e 0%,
                    #16213e 50%,
                    #0f3460 100%
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 25px;

            position: relative;
            overflow: hidden;
        }


        /* =====================================================
           SUBTLE BACKGROUND EFFECT
        ===================================================== */

        body::before {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            top: -250px;
            right: -200px;

            background: rgba(125, 211, 252, 0.06);

            border-radius: 50%;

            filter: blur(10px);

            pointer-events: none;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {
            width: 100%;
            max-width: 850px;

            text-align: center;

            position: relative;
            z-index: 1;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .title {
            font-size: clamp(2.1rem, 6vw, 4.5rem);

            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: 2px;

            line-height: 1.05;

            margin-bottom: 12px;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           SEASON
        ===================================================== */

        .season {
            font-size: clamp(1.1rem, 3vw, 1.6rem);

            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;

            opacity: 0.7;

            margin-bottom: 45px;
        }


        /* =====================================================
           COMING SOON CARD
        ===================================================== */

        .coming-soon {
            width: 100%;
            max-width: 650px;

            margin: 0 auto;

            padding: 38px 35px 42px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.16);

            border-radius: 22px;

            backdrop-filter: blur(14px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            font-size: clamp(1.5rem, 4vw, 2.3rem);

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 3px;

            line-height: 1.2;
        }


        /* =====================================================
           YEAR
        ===================================================== */

        .coming-soon .year {
            display: block;

            margin-top: 15px;

            font-size: clamp(4rem, 11vw, 7rem);

            line-height: 0.95;

            font-weight: 900;

            color: #7dd3fc;

            letter-spacing: 1px;

            text-shadow:
                0 5px 30px rgba(125, 211, 252, 0.18);
        }


        /* =====================================================
           WEBSITE AREA
        ===================================================== */

        .website-area {
            margin-top: 38px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .website-text {
            font-size: 14px;

            color: rgba(255, 255, 255, 0.6);

            margin-bottom: 13px;

            letter-spacing: 0.3px;
        }


        /* =====================================================
           VIEW WEBSITE BUTTON
        ===================================================== */

        .website-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 11px;

            min-width: 205px;

            padding: 14px 22px;

            background: #ffffff;

            color: #111827;

            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 10px;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 0.2px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .website-button:hover {
            background: #f0f9ff;

            transform: translateY(-3px);

            box-shadow:
                0 14px 32px rgba(0, 0, 0, 0.3);
        }


        .website-button:active {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.22);
        }


        /* =====================================================
           ARROW
        ===================================================== */

        .website-button .arrow {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            font-size: 19px;

            color: #0f6f9f;

            transition:
                transform 0.2s ease;
        }


        .website-button:hover .arrow {
            transform: translateX(4px);
        }


        /* =====================================================
           FOOTER NOTE
        ===================================================== */

        .footer-note {
            margin-top: 45px;

            font-size: 12px;

            color: rgba(255, 255, 255, 0.38);

            letter-spacing: 0.4px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 30px 18px;
            }

            .title {
                letter-spacing: 1px;
            }

            .season {
                margin-bottom: 32px;
            }

            .coming-soon {
                padding: 30px 20px 35px;

                border-radius: 18px;

                letter-spacing: 2px;
            }

            .coming-soon .year {
                margin-top: 12px;
            }

            .website-area {
                margin-top: 30px;
            }

            .website-button {
                width: 100%;
                max-width: 280px;
            }

            .footer-note {
                margin-top: 35px;
            }
        }

    </style>
</head>


<body>

    <main class="container">

        <h1 class="title">
            MEGA Messy Tournament
        </h1>

        <div class="season">
            Season 1
        </div>


        <section class="coming-soon">

            Coming in

            <span class="year">
                2027
            </span>

        </section>


        <div class="website-area">

            <p class="website-text">
                Explore the tournament website
            </p>

            <a href="home.html" class="website-button">
                <span>View Website</span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>

        </div>


        <p class="footer-note">
            MEGA Messy Tournament · Season 1
        </p>

    </main>

</body>
</html>
