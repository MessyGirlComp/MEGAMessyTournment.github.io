<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEGA Messy Tournament - Season 1</title>
	
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="M.M.Cup" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #1a1a2e,
                #16213e,
                #0f3460
            );
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .title {
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .season {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 700;
            margin-bottom: 45px;
            opacity: 0.85;
        }

        .coming-soon {
            display: inline-block;
            padding: 25px 40px;

            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;

            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .coming-soon .year {
            display: block;
            margin-top: 12px;

            font-size: clamp(3rem, 9vw, 6rem);
            line-height: 1;
            color: #7dd3fc;
        }

        /* =====================================================
           VIEW WEBSITE BUTTON
        ===================================================== */

        .website-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            margin-top: 35px;
            padding: 14px 24px;

            background: #111;
            color: white;
            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;

            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.3px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .website-button:hover {
            background: #222;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .website-button:active {
            transform: translateY(0);
        }

        .website-button .arrow {
            font-size: 18px;
            color: #7dd3fc;
            transition: transform 0.2s ease;
        }

        .website-button:hover .arrow {
            transform: translateX(3px);
        }

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .season {
                margin-bottom: 35px;
            }

            .coming-soon {
                padding: 25px 20px;
                letter-spacing: 2px;
            }

            .website-button {
                margin-top: 30px;
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1 class="title">MEGA Messy Tournament</h1>

        <div class="season">Season 1</div>

        <div class="coming-soon">
            Coming in
            <span class="year">2027</span>
        </div>

        <a href="home.html" class="website-button">
            View Website
            <span class="arrow">→</span>
        </a>

    </main>

</body>
</html>
