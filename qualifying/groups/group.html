<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qualifying Group | MEGA Messy Tournament</title>
	
<link rel="icon" type="image/png" href="../../assets/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="../../assets/favicon/favicon.svg" />
<link rel="shortcut icon" href="../../assets/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicon/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="M.M.Cup" />
<link rel="manifest" href="../../assets/favicon/site.webmanifest" />
	
<link rel="stylesheet" href="../../styles/page.css">
<link rel="stylesheet" href="../../styles/group.css">
	
    <script src="../../scripts/maintenance.js"></script>

	
	<style>
/* =========================================================
   MEGA MESSY TOURNAMENT
   GROUP PAGE STYLES
========================================================= */


/* =========================================================
   GROUP STATUS
========================================================= */

.group-status {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    max-width: 800px;
    margin: 0 auto 40px;
}

.status-box {
    background: white;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
}

.status-number {
    display: block;
    font-size: 28px;
    font-weight: 900;
}

.status-label {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.5;
}


/* =========================================================
   GROUP GIRLS GRID
   3 COLUMNS × 2 ROWS
========================================================= */

.group-girls-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 25px;
}


/* =========================================================
   GROUP GIRL CARD
========================================================= */

.group-girl-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    text-align: center;
    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.group-girl-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
}

.group-girl-card[hidden] {
    display: none;
}


/* =========================================================
   GROUP IMAGE
   LANDSCAPE
========================================================= */

.group-girl-image-wrapper {
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #e9edf3;
}

.group-girl-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


/* =========================================================
   GROUP CARD INFORMATION
========================================================= */

.group-girl-info {
    padding: 18px;
}

.group-girl-number {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.45;
    margin-bottom: 6px;
}

.group-girl-name {
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 10px;
}


/* =========================================================
   GROUP STATUS BADGES
========================================================= */

.group-status-badge {
    display: inline-block;
    margin-bottom: 13px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
}

.group-status-badge.qualified {
    background: #d4f7d4;
    color: #157515;
}

.group-status-badge.remaining {
    background: #dcecff;
    color: #0055aa;
}

.group-status-badge.eliminated {
    background: #ffdcdc;
    color: #aa0000;
}

.group-status-badge.wildcard {
    background: #fff0c7;
    color: #9a6500;
}


/* =========================================================
   GROUP PROFILE BUTTON
========================================================= */

.group-profile-button {
    display: inline-block;
    background: #111;
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    transition: background 0.2s ease;
}

.group-profile-button:hover {
    background: #333;
}


/* =========================================================
   VOTE SECTION
========================================================= */

.vote-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    justify-content: center;
    margin-top: 45px;
}

.vote-section .button {
    min-width: 300px;
    border: 0;
    cursor: pointer;
}

.vote-section .button:disabled {
    opacity: 0.5;
    cursor: default;
}


/* =========================================================
   GROUP LIST
   Used for the page listing all groups
========================================================= */

.group-list {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
}

.group-tile {
    display: block;
    background: white;
    padding: 28px 20px;
    border-radius: 16px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    transition: transform 0.3s ease;
}

.group-tile:hover {
    transform: translateY(-5px);
}

.group-tile strong {
    display: block;
    font-size: 22px;
    margin-bottom: 6px;
}

.group-tile span {
    color: #666;
    font-size: 14px;
}


/* =========================================================
   VOTING
========================================================= */

.group-vote-button {
    display: block;
    width: 100%;
    max-width: 220px;
    margin: 12px auto 0;
    background: #e8344e;
    color: white;
    border: 0;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
}

.group-vote-button:hover:not(:disabled) {
    background: #c42a41;
}

.group-vote-button:disabled {
    background: #c9ced6;
    color: #5b6470;
    cursor: default;
}

.group-vote-button.selected:disabled,
.group-vote-button.voted:disabled {
    color: white;
}

.group-vote-button.selected:disabled { background: #111; }
.group-vote-button.voted:disabled { background: #157515; }

.group-vote-button.selected {
    background: #111;
    color: white;
}

.group-vote-button.voted {
    background: #157515;
    color: white;
}

.vote-message {
    margin: 0;
    max-width: 600px;
    text-align: center;
    font-weight: 700;
}

.vote-message.error {
    color: #aa0000;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1000px) {

    .group-girls-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .group-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .group-girls-grid,
    .group-list,
    .group-status {
        grid-template-columns: 1fr;
    }

    .group-girl-image-wrapper {
        aspect-ratio: 16 / 10;
    }

    .vote-section .button {
        min-width: 0;
        width: 100%;
    }
}	
	</style>

</head>

<body>

<div id="siteHeader"></div>

<main>

    <div class="page-container">

        <div class="page-heading">
            <span class="stage-label">Qualifying Stage</span>
            <h1 id="groupTitle">Qualifying Group</h1>
            <p id="groupSubtitle"></p>
        </div>

        <div class="group-status" id="groupStatus">

            <div class="status-box">
                <span class="status-number" id="contestantCount">0</span>
                <span class="status-label">Contestants</span>
            </div>

            <div class="status-box">
                <span class="status-number" id="qualifyCount">0</span>
                <span class="status-label">Qualify</span>
            </div>

            <div class="status-box">
                <span class="status-number" id="wildcardCount">0</span>
                <span class="status-label">Wildcard</span>
            </div>

        </div>

        <div class="group-girls-grid" id="girlsGrid"></div>

        <div class="profile-error" id="errorMessage" hidden>
            <h2 id="errorTitle">Group Not Found</h2>
            <p>We couldn't find the requested qualifying group.</p>
            <a class="button" id="errorLink">View Group Stages</a>
        </div>

        <div class="vote-section" id="voteArea"></div>

    </div>

</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../scripts/girls-data.js"></script>
<script src="../../scripts/site.js"></script>
<script src="../../scripts/supabase-config.js"></script>
<script src="../../scripts/votes.js"></script>
<script src="../../scripts/group.js"></script>

</body>

</html>
