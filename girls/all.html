<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Girls | MEGA Messy Tournament</title>

<link rel="stylesheet" href="../styles/site.css">

</head>

<body>

<div id="siteHeader"></div>

<main>

    <div class="page-container">

        <div class="page-heading">
            <h1>All Girls</h1>
            <p>Browse every contestant in the MEGA Messy Tournament.</p>
        </div>

        <!-- =====================================================
             FILTERS
        ====================================================== -->

        <div class="filters">

            <div class="filter-top">

                <label for="statusFilter" class="filter-label">Status</label>

                <select id="statusFilter" class="filter-select">
                    <option value="all" selected>All Girls</option>
                    <option value="qualified">Qualified Girls</option>
                    <option value="remaining">Remaining Girls</option>
                    <option value="eliminated">Eliminated Girls</option>
                </select>

                <label for="messFilter" class="filter-label">Mess Type</label>

                <select id="messFilter" class="filter-select">
                    <option value="all" selected>All Mess Types</option>
                    <option value="gunge">Gunge</option>
                    <option value="slime">Slime</option>
                    <option value="water">Water</option>
                    <option value="food">Food</option>
                    <option value="mud">Mud</option>
                    <option value="other">Other</option>
                </select>

                <label for="sourceFilter" class="filter-label">Source</label>

                <select id="sourceFilter" class="filter-select">
                    <option value="all" selected>All Sources</option>
                    <option value="game-show">Game Show</option>
                    <option value="online-trend">Online Trend</option>
                    <option value="youtube">YouTube</option>
                    <option value="tv">TV</option>
                    <option value="other">Other</option>
                </select>

                <input
                    type="text"
                    class="search-box"
                    id="searchBox"
                    placeholder="Search girls..."
                >

                <button type="button" class="button" id="resetFilters">
                    Reset Filters
                </button>

            </div>

        </div>


        <!-- =====================================================
             GIRLS GRID

             To add a girl: copy one card, then change
             data-status, data-name, data-mess-type, data-source,
             the image number, the name and the profile link.

             data-status     qualified | remaining | eliminated
             data-mess-type  gunge | slime | water | food | mud | other
             data-source     game-show | online-trend | youtube | tv | other

             Image: assets/girls/A/001.png (first profile image)
        ====================================================== -->

        <div class="girls-grid" id="girlsGrid">

            <!-- 001 -->
            <div class="girl-card" data-status="remaining" data-name="Amy" data-mess-type="gunge" data-source="game-show">
                <div class="girl-image-wrapper">
                    <img src="../assets/girls/A/001 A.png" class="girl-image" alt="Amy" loading="lazy">
                </div>
                <div class="girl-info">
                    <div class="girl-card-number">Girl 001</div>
                    <div class="girl-card-name">Amy</div>
                    <div class="status-badge remaining">Competing</div>
                    <br>
                    <a href="profiles/profile.html?girl=001" class="profile-button">View Profile</a>
                </div>
            </div>

            <div class="no-results" id="noResults" hidden>
                No girls match your filters.
            </div>

        </div>

    </div>

</main>

<div id="siteFooter"></div>

<script src="../scripts/girls-data.js"></script>
<script src="../scripts/site.js"></script>

<script>

const statusFilter = document.getElementById("statusFilter");
const messFilter = document.getElementById("messFilter");
const sourceFilter = document.getElementById("sourceFilter");
const searchBox = document.getElementById("searchBox");
const resetFilters = document.getElementById("resetFilters");
const noResults = document.getElementById("noResults");

const cards = document.querySelectorAll(".girl-card");


function updateCards() {

    const statusValue = statusFilter.value;
    const messValue = messFilter.value;
    const sourceValue = sourceFilter.value;
    const searchValue = searchBox.value.toLowerCase().trim();

    let visible = 0;

    cards.forEach(card => {

        const match =
            (statusValue === "all" || card.dataset.status === statusValue) &&
            (messValue === "all" || card.dataset.messType === messValue) &&
            (sourceValue === "all" || card.dataset.source === sourceValue) &&
            (card.dataset.name || "").toLowerCase().includes(searchValue);

        card.hidden = !match;

        if (match) {
            visible++;
        }

    });

    noResults.hidden = visible > 0;

}

[statusFilter, messFilter, sourceFilter].forEach(select => {
    select.addEventListener("change", updateCards);
});

searchBox.addEventListener("input", updateCards);

resetFilters.addEventListener("click", () => {

    statusFilter.value = "all";
    messFilter.value = "all";
    sourceFilter.value = "all";
    searchBox.value = "";

    updateCards();

});

</script>

</body>

</html>
