<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Girls | MEGA Messy Tournament</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f6f8;
    color:#222;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

.site-header{
    background:#111;
    color:white;
    width:100%;
}

.header-inner{
    max-width:1400px;
    margin:0 auto;
    padding:18px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.site-logo{
    color:white;
    text-decoration:none;
    font-size:22px;
    font-weight:800;
    line-height:1.1;
    white-space:nowrap;
}

.site-logo span{
    display:block;
    font-size:13px;
    font-weight:500;
    opacity:0.7;
    margin-top:4px;
}

/* =========================================================
   NAVIGATION
========================================================= */

.main-nav{
    display:flex;
    align-items:center;
    gap:8px;
}

.main-nav > a,
.dropdown-button{
    color:white;
    text-decoration:none;
    background:transparent;
    border:none;
    padding:10px 13px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border-radius:7px;
    transition:0.2s;
}

.main-nav > a:hover,
.dropdown-button:hover{
    background:#2a2a2a;
}

/* =========================================================
   DROPDOWNS
========================================================= */

.nav-dropdown{
    position:relative;
}

.dropdown-button{
    display:flex;
    align-items:center;
    gap:7px;
}

.dropdown-menu{
    position:absolute;
    top:calc(100% + 5px);
    left:0;
    min-width:210px;
    background:white;
    border-radius:10px;
    box-shadow:0 12px 35px rgba(0,0,0,0.18);
    padding:7px;
    opacity:0;
    visibility:hidden;
    transform:translateY(-5px);
    transition:0.2s;
    z-index:1000;
}

.nav-dropdown:hover .dropdown-menu{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.dropdown-menu a{
    display:block;
    color:#222;
    text-decoration:none;
    padding:10px 12px;
    border-radius:7px;
}

.dropdown-menu a:hover{
    background:#f0f1f3;
}

/* =========================================================
   PAGE
========================================================= */

main{
    flex:1;
}

.page-container{
    max-width:1400px;
    margin:auto;
    padding:50px 30px;
}

.page-heading{
    text-align:center;
    margin-bottom:35px;
}

.page-heading h1{
    font-size:42px;
    margin-bottom:10px;
}

.page-heading p{
    color:#666;
}

/* =========================================================
   FILTERS
========================================================= */

.filters{
    background:white;
    padding:25px;
    border-radius:15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);

    margin-bottom:35px;
}

.filter-top{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.filter-label{
    font-size:15px;
    font-weight:700;
}

.status-filter{
    min-width:220px;

    padding:12px 15px;

    background:white;

    border:1px solid #d9d9d9;
    border-radius:8px;

    font-size:15px;
    font-weight:600;

    color:#222;

    cursor:pointer;

    outline:none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.status-filter:hover{
    border-color:#999;
}

.status-filter:focus{
    border-color:#111;

    box-shadow:
        0 0 0 3px rgba(0,0,0,0.08);
}

.search-box{
    width:100%;
    max-width:400px;

    padding:12px 15px;

    border:1px solid #d9d9d9;
    border-radius:8px;

    font-size:15px;

    outline:none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.search-box:focus{
    border-color:#111;

    box-shadow:
        0 0 0 3px rgba(0,0,0,0.08);
}

/* =========================================================
   GIRL GRID
========================================================= */

.girls-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

.girl-card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    text-align:center;
    transition:0.3s;
}

.girl-card:hover{
    transform:translateY(-5px);
}

.girl-image-wrapper{
    aspect-ratio:1/1;
    overflow:hidden;
}

.girl-image{
    width:100%;
    height:100%;
    object-fit:cover;
}

.girl-info{
    padding:20px;
}

.girl-name{
    font-size:22px;
    font-weight:800;
    margin-bottom:15px;
}

.status-badge{
    display:inline-block;
    margin-bottom:15px;
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.qualified{background:#d4f7d4;color:#157515;}
.remaining{background:#dcecff;color:#0055aa;}
.eliminated{background:#ffdcdc;color:#aa0000;}

.profile-button{
    display:inline-block;
    background:#111;
    color:white;
    text-decoration:none;
    padding:11px 20px;
    border-radius:8px;
    font-weight:700;
}
	
/* =========================================================
   RESET FILTER BUTTON
========================================================= */

.reset-filter-button{
    padding:12px 18px;

    background:#111;
    color:white;

    border:none;
    border-radius:8px;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.reset-filter-button:hover{
    background:#333;
    transform:translateY(-1px);
}

.reset-filter-button:active{
    transform:translateY(0);
}


/* =========================================================
   FILTER RESPONSIVE LAYOUT
========================================================= */

@media(max-width:1000px){

    .filter-top{
        gap:12px;
    }

    .status-filter{
        min-width:200px;
    }

    .search-box{
        max-width:300px;
    }

}

@media(max-width:600px){

    .filter-top{
        flex-direction:column;
        align-items:stretch;
    }

    .filter-label{
        margin-top:5px;
    }

    .status-filter,
    .search-box,
    .reset-filter-button{
        width:100%;
        max-width:none;
    }

}

/* =========================================================
   FOOTER
========================================================= */

.site-footer{
    background:#111;
    color:#aaa;
    text-align:center;
    padding:25px;
    margin-top:auto;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){
    .girls-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .header-inner{
        flex-direction:column;
    }

    .main-nav{
        flex-wrap:wrap;
        justify-content:center;
    }
}

@media(max-width:600px){
    .girls-grid{
        grid-template-columns:1fr;
    }

    .page-heading h1{
        font-size:32px;
    }
}

</style>
</head>
<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="site-header">

    <div class="header-inner">

        <a href="../index.html" class="site-logo">
            MEGA Messy Tournament
            <span>Season 1</span>
        </a>

        <nav class="main-nav">

            <a href="../index.html">Home</a>

            <div class="nav-dropdown">
                <button class="dropdown-button">
                    Qualifying Stage <span>⌄</span>
                </button>

                <div class="dropdown-menu">
                    <a href="../qualifying/index.html">Qualifying Home</a>
                    <a href="../qualifying/groups/index.html">Group Stages</a>
                    <a href="../qualifying/wildcard.html">Wildcard Stage</a>
                    <a href="../qualifying/eliminated.html">Eliminated Girls</a>
                    <a href="../qualifying/qualified.html">Qualifying Girls</a>
                </div>
            </div>

            <a href="../news/index.html">News</a>

        </nav>

    </div>

</header>

<!-- =========================================================
     MAIN
========================================================= -->

<main>

<div class="page-container">

    <div class="page-heading">
        <h1>All Girls</h1>
        <p>Browse every contestant in the MEGA Messy Tournament.</p>
    </div>

<!-- =========================================================
     FILTERS
========================================================= -->

<div class="filters">

    <div class="filter-top">

        <!-- STATUS -->

        <label for="statusFilter" class="filter-label">
            Status
        </label>

        <select id="statusFilter" class="status-filter">

            <option value="all" selected>
                All Girls
            </option>

            <option value="qualified">
                Qualified Girls
            </option>

            <option value="remaining">
                Remaining Girls
            </option>

            <option value="eliminated">
                Eliminated Girls
            </option>

        </select>


        <!-- MESS TYPE -->

        <label for="messFilter" class="filter-label">
            Mess Type
        </label>

        <select id="messFilter" class="status-filter">

            <option value="all" selected>
                All Mess Types
            </option>

            <option value="gunge">
                Gunge
            </option>

            <option value="slime">
                Slime
            </option>

            <option value="water">
                Water
            </option>

            <option value="food">
                Food
            </option>

            <option value="mud">
                Mud
            </option>

            <option value="other">
                Other
            </option>

        </select>


        <!-- SOURCE -->

        <label for="sourceFilter" class="filter-label">
            Source
        </label>

        <select id="sourceFilter" class="status-filter">

            <option value="all" selected>
                All Sources
            </option>

            <option value="game-shows">
                Game Shows
            </option>

            <option value="online-trends">
                Online Trends
            </option>

            <option value="youtube">
                YouTube
            </option>

            <option value="tv">
                TV
            </option>

            <option value="other">
                Other
            </option>

        </select>


        <!-- SEARCH -->

        <input
            type="text"
            class="search-box"
            id="searchBox"
            placeholder="Search girls..."
        >


        <!-- RESET -->

        <button
            type="button"
            class="reset-filter-button"
            id="resetFilters"
        >
            Reset Filters
        </button>

    </div>

</div>
   <!-- GRID -->

<div class="girls-grid" id="girlsGrid">

<!-- 001 -->
<div class="girl-card" data-status="remaining" data-name="Amy" data-mess-type="gunge" data-source="game-shows">
    <div class="girl-image-wrapper">
        <img src="../assets/girls/A/001 A.png" class="girl-image" alt="Amy">
    </div>
    <div class="girl-info">
        <div class="girl-name">Amy</div>
        <a href="profile.html?girl=001" class="profile-button">View Profile</a>
    </div>
</div>



</div>
</div>



</main>

	<script src="../scripts/girls-data.js"></script>

<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="site-footer">
    <p>© 2026 MEGA Messy Tournament. All rights reserved.</p>
</footer>

<script>

const statusFilter = document.getElementById("statusFilter");
const messFilter = document.getElementById("messFilter");
const sourceFilter = document.getElementById("sourceFilter");
const searchBox = document.getElementById("searchBox");
const resetFilters = document.getElementById("resetFilters");

const cards = document.querySelectorAll(".girl-card");


/* =========================================================
   UPDATE FILTERS
========================================================= */

function updateCards(){

    const statusValue = statusFilter.value;
    const messValue = messFilter.value;
    const sourceValue = sourceFilter.value;

    const searchValue =
        searchBox.value.toLowerCase().trim();


    cards.forEach(card => {

        const status =
            card.dataset.status || "";

        const name =
            (card.dataset.name || "").toLowerCase();

        const messType =
            card.dataset.messType || "";

        const source =
            card.dataset.source || "";


        /* STATUS */

        const statusMatch =
            statusValue === "all" ||
            status === statusValue;


        /* MESS TYPE */

        const messMatch =
            messValue === "all" ||
            messType === messValue;


        /* SOURCE */

        const sourceMatch =
            sourceValue === "all" ||
            source === sourceValue;


        /* SEARCH */

        const searchMatch =
            name.includes(searchValue);


        /* FINAL RESULT */

        if(
            statusMatch &&
            messMatch &&
            sourceMatch &&
            searchMatch
        ){

            card.style.display = "";

        }else{

            card.style.display = "none";

        }

    });

}


/* =========================================================
   FILTER EVENTS
========================================================= */

statusFilter.addEventListener(
    "change",
    updateCards
);

messFilter.addEventListener(
    "change",
    updateCards
);

sourceFilter.addEventListener(
    "change",
    updateCards
);

searchBox.addEventListener(
    "input",
    updateCards
);


/* =========================================================
   RESET FILTERS
========================================================= */

resetFilters.addEventListener("click", () => {

    statusFilter.value = "all";

    messFilter.value = "all";

    sourceFilter.value = "all";

    searchBox.value = "";

    updateCards();

});

</script>


</body>
</html>
